<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090B"/>
      <stop offset="100%" style="stop-color:#111114"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <ellipse cx="600" cy="315" rx="500" ry="280" fill="url(#glow)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <rect width="60" height="60" fill="none" stroke="rgba(16,185,129,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Emerald accent line -->
  <rect x="80" y="240" width="60" height="3" rx="1.5" fill="#10B981"/>
  <!-- Name -->
  <text x="80" y="310" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#FAFAFA" letter-spacing="-0.03em">Samir George</text>
  <!-- Tagline -->
  <text x="80" y="370" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#10B981">Technical Product Builder</text>
  <!-- Arabic subtitle -->
  <text x="80" y="420" font-family="Noto Sans Arabic, system-ui, sans-serif" font-size="20" fill="#A1A1AA" direction="rtl">أصوغ الوضوح من الفوضى</text>
  <!-- Domain -->
  <text x="80" y="550" font-family="JetBrains Mono, monospace" font-size="16" fill="#71717A">samirgeorge.com</text>
  <!-- Corner decoration -->
  <rect x="1100" y="50" width="50" height="2" fill="#10B981" opacity="0.3"/>
  <rect x="1148" y="50" width="2" height="50" fill="#10B981" opacity="0.3"/>
</svg>
